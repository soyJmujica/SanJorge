{% extends "base.html" %}
{% load static %}
{% block content %}
<br>
<br>

<div class="lista-canciones">
    <div class="encabezado-lista">
        <h2>Lista de canciones</h2>
    </div>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="buscador-contenedor">
        <i class="fa fa-search icono-buscador"></i>
        <input 
            type="text" 
            id="inputBuscador" 
            placeholder="Buscar canción por título..." 
            onkeyup="filtrarCanciones()"
        >
    </div>
    
    <div class="cuerpo-lista" id="contenedorCanciones">
        {% for cancion in canciones %}
            <!-- Convertido a <a> para que TODA la tarjeta sea el enlace -->
            <a href="{% url 'detalle_cancion' cancion.id %}" class="item-cancion">
                <div class="info-cancion">
                    <i class="fa {{ cancion.icono|default:'fa-music' }} icono-estado"></i>
                    <span class="titulo-cancion">{{ cancion.titulo }}</span>
                </div>
                <div class="icono-accion" title="Ver detalle">
                    <i class="fa fa-chevron-right"></i>
                </div>
            </a>
        {% empty %}
            <div class="item-vacio">
                <span>No hay canciones disponibles.</span>
            </div>
        {% endfor %}

        <!-- Mensaje cuando la búsqueda no encuentra coincidencias -->
        <div id="sinResultados" class="item-vacio" style="display: none;">
            <span>No se encontraron canciones.</span>
        </div>
    </div>
</div>

{% endblock %}
